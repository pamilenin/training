<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07539b">

  <title>Болдер — UMC diary</title>

  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/boulder.css">
</head>

<body>
  <main class="app boulder">
    <header class="hero">
      <a class="hero__action hero__back"
         href="./reference-top-test.html" aria-label="На главную">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m15 5-7 7 7 7"/>
        </svg>
      </a>

      <h1 class="hero__heading">
        <span class="hero__title">Болдер</span>
        <span class="hero__subtitle" id="training-date-label"
              aria-live="polite"></span>
      </h1>

      <div class="hero__action boulder-calendar">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="16" rx="2"/>
          <path d="M7 3v4m10-4v4M3 10h18m-13 4h2m4 0h2m-8 3h2m4 0h2"/>
        </svg>

        <input class="boulder-calendar__input" type="date"
               id="training-date" name="date" form="session"
               aria-label="Выбрать дату тренировки"
               aria-describedby="training-date-label" required>
      </div>
    </header>

    <form class="session" id="session" novalidate>
      <div class="session-meta">
        <input class="session-gym" type="text" name="gym"
               aria-label="Название зала" placeholder="Название зала"
               maxlength="100">
      </div>

      <fieldset class="route">
        <legend id="route-title" tabindex="-1">Трасса 1</legend>

        <label class="route-row">
          <span>Категория</span>
          <select name="grade" required>
            <option value="" disabled selected>Выбрать</option>
            <option value="5C">5C</option>
            <option value="6A">6A</option>
            <option value="6B">6B</option>
            <option value="6C">6C</option>
            <option value="7A">7A</option>
            <option value="7B">7B</option>
            <option value="custom">Сложнее</option>
          </select>
        </label>

        <label class="route-row" id="custom-grade-row" hidden>
          <span>Своя категория</span>
          <input type="text" name="custom-grade" placeholder="Например, 7C+"
                 maxlength="20" disabled>
        </label>

        <label class="route-row">
          <span>Название / Цвет</span>
          <input type="text" name="problem" placeholder="Синяя № 12"
                 maxlength="100">
        </label>

        <label class="route-row">
          <span>Результат</span>
          <select name="result">
            <option value="sent">Пролез</option>
            <option value="project" selected>В работе</option>
          </select>
        </label>

        <label class="route-row">
          <span>Попытки</span>
          <input type="number" name="attempts" min="1" step="1"
                 inputmode="numeric" value="1" required>
        </label>

        <div class="route-row route-row--notes">
          <textarea name="route-notes" rows="2" maxlength="2000"
                    aria-label="Заметки" placeholder="Заметки"></textarea>
        </div>
      </fieldset>

      <p class="status" id="status" role="status"></p>
    </form>

    <footer>
      <div class="actions">
        <button class="finish" id="finish" type="button">
          Завершить и сохранить
        </button>
        <button class="next" type="submit" form="session">
          Следующая трасса
        </button>
      </div>

      <img class="reference-ridge"
           src="./assets/reference-v3/home-ridge.png"
           width="412" height="86" alt="">

      <nav class="dock" aria-label="Основное меню">
        <a class="dock__active" href="./reference-top-test.html">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m2 11 10-8 10 8h-3v10h-5v-6h-4v6H5V11z"
                  fill="currentColor"/>
          </svg>
          Главная
        </a>

        <button type="button" data-message="Дневник доступен в основном превью.">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="16" rx="2"/>
            <path d="M7 3v4m10-4v4M3 10h18m-13 4h3m-3 3h6"/>
          </svg>
          Дневник
        </button>

        <button type="button"
                data-message="Статистика в этом превью не подключена.">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 20v-5m5 5v-8m5 8V8m5 12V4" stroke-width="3"/>
          </svg>
          Статистика
        </button>

        <button type="button" data-message="Профиль в этом превью не подключён.">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="7" r="4"/>
            <path d="M4 21v-2a8 5 0 0 1 16 0v2z"/>
          </svg>
          Профиль
        </button>
      </nav>
    </footer>
  </main>

  <p class="toast" id="toast" role="status" hidden></p>

  <script>
    const form = document.getElementById('session');
    const routeTitle = document.getElementById('route-title');
    const statusMessage = document.getElementById('status');
    const dateLabel = document.getElementById('training-date-label');
    const customGradeRow = document.getElementById('custom-grade-row');
    const field = (name) => form.elements.namedItem(name);

    const date = field('date');
    const gym = field('gym');
    const grade = field('grade');
    const customGrade = field('custom-grade');
    const problem = field('problem');
    const result = field('result');
    const attempts = field('attempts');
    const notes = field('route-notes');

    const storageKey = 'umc-diary:boulder-sessions';
    const routes = [];

    // valueAsDate возвращает календарную дату в UTC.
    const dateFormatter = new Intl.DateTimeFormat('ru-RU', {
      day: 'numeric',
      month: 'long',
      timeZone: 'UTC'
    });

    function todayValue() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${now.getFullYear()}-${month}-${day}`;
    }

    function updateDateLabel() {
      const selected = date.valueAsDate;

      if (!selected) {
        dateLabel.textContent = 'Выбрать дату';
        return;
      }

      const formatted = dateFormatter.format(selected);
      dateLabel.textContent = date.value === todayValue()
        ? `сегодня, ${formatted}`
        : formatted;
    }

    function setToday() {
      date.value = todayValue();
      updateDateLabel();
    }

    date.addEventListener('input', updateDateLabel);
    date.addEventListener('change', updateDateLabel);

    date.addEventListener('click', () => {
      if (typeof date.showPicker !== 'function') return;

      try {
        date.showPicker();
      } catch {
        // Не отменяем стандартное действие нативного поля.
      }
    });

    function syncCustomGrade(moveFocus = false) {
      const show = grade.value === 'custom';
      customGradeRow.hidden = !show;
      customGrade.disabled = !show;
      customGrade.required = show;

      if (!show) customGrade.value = '';
      if (show && moveFocus) customGrade.focus();
    }

    function resetRoute() {
      grade.value = '';
      syncCustomGrade();
      problem.value = '';
      result.value = 'project';
      attempts.value = '1';
      notes.value = '';
      routeTitle.textContent = `Трасса ${routes.length + 1}`;
    }

    function routeHasInput() {
      return Boolean(
        grade.value ||
        problem.value.trim() ||
        result.value !== 'project' ||
        attempts.value !== '1' ||
        notes.value.trim()
      );
    }

    function showError(message, control) {
      statusMessage.textContent = message;
      control.focus();
      return null;
    }

    function readRoute() {
      if (!grade.value) {
        return showError('Выбери категорию трассы.', grade);
      }

      const routeGrade = grade.value === 'custom'
        ? customGrade.value.trim()
        : grade.value;

      if (!routeGrade) {
        return showError('Введи категорию вручную.', customGrade);
      }

      const attemptCount = attempts.valueAsNumber;

      if (!Number.isInteger(attemptCount) || attemptCount < 1) {
        return showError('Укажи целое число попыток: 1 или больше.', attempts);
      }

      return {
        name: problem.value.trim(),
        grade: routeGrade,
        result: result.value,
        attempts: attemptCount,
        notes: notes.value.trim()
      };
    }

    grade.addEventListener('change', () => syncCustomGrade(true));

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const route = readRoute();
      if (!route) return;

      routes.push(route);
      gym.disabled = true;
      resetRoute();
      statusMessage.textContent =
        `Трасса добавлена. Всего трасс: ${routes.length}.`;

      // Переходим на заголовок, не открывая список категорий.
      routeTitle.focus();
    });

    document.getElementById('finish').addEventListener('click', () => {
      if (!date.checkValidity()) {
        showError('Укажи дату тренировки.', date);
        return;
      }

      const sessionRoutes = [...routes];

      // Если новая трасса пуста, сохраняем только уже добавленные.
      if (routeHasInput() || sessionRoutes.length === 0) {
        const current = readRoute();
        if (!current) return;
        sessionRoutes.push(current);
      }

      const session = {
        type: 'boulder',
        date: date.value,
        gym: gym.value.trim(),
        routes: sessionRoutes,
        savedAt: new Date().toISOString()
      };

      try {
        const sessions = JSON.parse(localStorage.getItem(storageKey) ?? '[]');
        sessions.unshift(session);
        localStorage.setItem(storageKey, JSON.stringify(sessions));
      } catch {
        statusMessage.textContent =
          'Не удалось сохранить тренировку. Данные остались на странице.';
        return;
      }

      routes.length = 0;
      form.reset();
      gym.disabled = false;
      setToday();
      resetRoute();
      statusMessage.textContent =
        `Тренировка сохранена на этом устройстве. Трасс: ${sessionRoutes.length}.`;
    });

    const toast = document.getElementById('toast');
    let toastTimer;

    document.querySelectorAll('[data-message]').forEach((button) => {
      button.addEventListener('click', () => {
        clearTimeout(toastTimer);
        toast.textContent = button.dataset.message;
        toast.hidden = false;

        toastTimer = setTimeout(() => {
          toast.hidden = true;
        }, 2500);
      });
    });

    gym.disabled = false;
    setToday();
    syncCustomGrade();
  </script>
</body>
</html>
