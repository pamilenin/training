<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07539b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UMC diary">
  <link rel="apple-touch-icon" sizes="180x180"
      href="./assets/reference-v3/home-icon.png">
  <title>UMC diary</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #e6f5ff;
      color: #0c2358;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    button {
      font: inherit;
      color: inherit;
    }

    button:focus-visible {
      outline: 3px solid #0064e8;
      outline-offset: 3px;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 460px;
      min-height: 100vh;
      min-height: 100lvh;
      margin-inline: auto;
      background: #eef8fd;
      container-type: inline-size;
    }

    .content {
      padding: 0 18px;
    }

    /* Один фон от верхнего края, без отдельной полосы под часами. */
    .hero {
      position: relative;
      width: calc(100% + 36px);
      margin-inline: -18px;
      height: auto;
      min-height: 0;
      max-height: none;
      aspect-ratio: 900 / 500;
      background: url("./assets/reference-v3/home-hero-ice-final.png")
        center top / 100% auto no-repeat;
    }

    .greeting {
      position: absolute;
      top: 49%;
      left: 12%;
    }

    .greeting h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(30px, 10vw, 50px);
      font-size: 11cqw;
      font-style: italic;
      font-weight: 850;
      line-height: .96;
      letter-spacing: -.045em;
      transform: rotate(-13deg);
      transform-origin: left center;
    }

    .settings {
      position: absolute;
      top: max(28%, calc(env(safe-area-inset-top, 0px) + 4px));
      right: calc(12.5% - 21px);
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .tagline {
      margin: 0 0 22px 4%;
      font-size: clamp(17px, 4.8vw, 21px);
      font-weight: 750;
    }

    .goal {
      padding: 13px 18px 14px;
      border: 1px solid #fff;
      border-radius: 16px;
      background: linear-gradient(120deg, #d8effd, #c9e8fb);
    }

    .goal h2 {
      margin: 0 0 5px;
      font-size: 19px;
      font-weight: 650;
    }

    .goal-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: clamp(18px, 5.2vw, 24px);
      font-weight: 800;
      line-height: 1.15;
    }

    .progress {
      height: 14px;
      margin-top: 12px;
      overflow: hidden;
      border: 1px solid #fff;
      border-radius: 99px;
      background: #a8dcfb;
    }

    .progress span {
      display: block;
      width: 75%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #008cfc, #0061e9);
    }

    .goal-note {
      margin: 7px 0 0;
      font-size: 16px;
    }

    .today h2 {
      margin: 14px 0 8px;
      font-size: 28px;
      line-height: 1.15;
    }

    .workout {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 11px;
      border: 1px solid #b0daf5;
      border-radius: 15px;
      background: #f7fcff;
      text-align: left;
      cursor: pointer;
    }

    .badge {
      display: grid;
      place-items: center;
      width: clamp(46px, 16vw, 64px);
      aspect-ratio: 1;
      border-radius: 50%;
      color: #0060e8;
      background: #c7eafd;
    }

    .workout-text {
      display: grid;
      gap: 2px;
    }

    .workout-text strong {
      font-size: 21px;
      line-height: 1.1;
    }

    .workout-label,
    .workout-meta {
      color: #17447d;
    }

    .workout-label {
      font-size: 14px;
    }

    .workout-meta {
      font-size: 13px;
    }

    /* Свободное место остаётся над кнопкой, а не под меню. */
    .home-bottom {
      margin-top: auto;
    }

    .home-start-wrap {
      padding: 10px 18px 0;
    }

    .start {
      display: block;
      width: 100%;
      min-height: 66px;
      padding: 10px 14px;
      border: 0;
      color: #fff;
      background: url("./assets/reference-v3/home-start-brush.png")
        center / contain no-repeat;
      font-size: clamp(17px, 5vw, 22px);
      font-weight: 750;
      text-shadow: 0 1px 3px #082456;
      cursor: pointer;
    }

    .reference-ridge {
      display: block;
      width: 100%;
      height: auto;
    }

    .dock {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      padding: 5px 8px env(safe-area-inset-bottom, 0px);
      background: #edf8ff;
    }

    .dock button {
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 3px;
      min-height: 44px;
      padding: 4px 0;
      border: 0;
      background: transparent;
      font-size: clamp(11px, 3.2vw, 14px);
      cursor: pointer;
    }

    .dock [aria-current="page"] {
      color: #005de8;
      font-weight: 750;
    }

    .icon {
      width: 25px;
      height: 25px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .settings .icon {
      width: 34px;
      height: 34px;
      color: #255ba8;
      filter:
        drop-shadow(1px 0 0 #fff)
        drop-shadow(-1px 0 0 #fff)
        drop-shadow(0 1px 0 #fff)
        drop-shadow(0 -1px 0 #fff);
    }

    .badge .icon {
      width: 38px;
      height: 38px;
    }

    .toast {
      position: fixed;
      z-index: 1;
      right: 16px;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      left: 16px;
      width: fit-content;
      max-width: calc(100% - 32px);
      margin: 0 auto;
      padding: 10px 14px;
      border-radius: 10px;
      background: #0c2358;
      color: #fff;
      font-size: 14px;
      pointer-events: none;
    }

    /* Заставка поверх страницы: места в раскладке не занимает. */
    .launch-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: #000;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 800ms ease-in-out, visibility 0s linear 800ms;
    }

    .show-launch-screen .launch-screen {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: none;
    }

    .launch-screen__badge {
      display: grid;
      place-items: center;
      width: min(52vw, 210px);
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 50%;
      background: #fff;
      opacity: 0;
      transition: opacity 650ms ease-in-out;
    }

    .launch-logo-ready .launch-screen__badge {
      opacity: 1;
    }

    .launch-screen__logo {
      display: block;
      width: 86%;
      height: auto;
    }

    @media (prefers-reduced-motion: reduce) {
      .launch-screen,
      .launch-screen__badge {
        transition: none;
      }
    }

.training-types legend {
  margin-bottom: 10px;
  padding: 0;
  font-size: 24px;
  font-weight: 800;
}

.training-types label span {
  display: grid;
  place-items: center;
  min-height: 56px;
  padding: 8px;
  border: 2px solid #b0daf5;
  border-radius: 14px;
  background: #f7fcff;
  font-weight: 750;
  text-align: center;
}

.training-types input:checked + span {
  border-color: #07539b;
  background: #07539b;
  color: #fff;
}

.training-types input:focus-visible + span {
  outline: 3px solid #0064e8;
  outline-offset: 3px;
}
    .training-types {
  min-inline-size: 0;
  margin: 0;
  padding: 0;
  border: 0;
}

.training-types legend {
  margin: 0 0 6px;
  padding: 0;
  font-size: clamp(22px, 6vw, 28px);
  font-weight: 850;
  line-height: 1.12;
}

.training-types__list {
  display: grid;
  gap: 3px;
}

.training-option {
  position: relative;
  display: block;
  cursor: pointer;
}

.training-option input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.training-option__row {
  display: grid;
  grid-template-columns: 74px minmax(0, 1fr);
  align-items: center;
  gap: 12px;
  min-height: 52px;
  padding-inline: 8px;
  border-radius: 10px;
  font-size: clamp(18px, 5vw, 24px);
  font-weight: 800;
  line-height: 1.15;
}

.training-option__badge {
  position: relative;
  display: grid;
  place-items: center;
  width: 74px;
  height: 50px;
  color: #fff;
}

.training-option__badge::before {
  content: "";
  position: absolute;
  inset: 0;
  background: url("./assets/reference-v3/home-start-brush.png")
    center / 100% 100% no-repeat;
  transform: rotate(-7deg);
}

.training-option__badge svg {
  position: relative;
  width: 33px;
  height: 33px;
  fill: none;
  stroke: currentColor;
  stroke-width: 3.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.training-option input:checked + .training-option__row
  .training-option__badge::before {
  filter: brightness(.67) saturate(.85);
}

.training-option input:focus-visible + .training-option__row {
  outline: 3px solid #0064e8;
  outline-offset: 1px;
}
    
  </style>

  <script>
    (() => {
      const standalone =
        window.matchMedia('(display-mode: standalone)').matches ||
        navigator.standalone === true;

      if (!standalone) return;

      const root = document.documentElement;
      const hide = () => root.classList.remove('show-launch-screen');

      root.classList.add('show-launch-screen');

      // Не оставляем чёрный экран, если картинка не загрузилась.
      const fallback = window.setTimeout(hide, 8000);

      document.addEventListener('DOMContentLoaded', async () => {
        const logo = document.querySelector('.launch-screen__logo');

        try {
          await logo.decode();
        } catch {
          window.clearTimeout(fallback);
          hide();
          return;
        }

        if (!root.classList.contains('show-launch-screen')) return;

        const reducedMotion =
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            if (!root.classList.contains('show-launch-screen')) return;

            window.clearTimeout(fallback);
            root.classList.add('launch-logo-ready');

            // Пять секунд полностью видимого логотипа, не считая появления.
            window.setTimeout(hide, 3000 + (reducedMotion ? 0 : 650));
          });
        });
      }, { once: true });
    })();
  </script>
</head>

<body>
  <div class="launch-screen" aria-hidden="true">
    <div class="launch-screen__badge">
      <img class="launch-screen__logo"
           src="./assets/reference-v3/umc-logo.png"
           width="900" height="900" alt="">
    </div>
  </div>

  <main class="app">
    <div class="content">
      <header>
        <div class="hero">
          <div class="greeting">
            <h1>Привет,<br>Денис</h1>
          </div>

          <button class="settings" type="button" aria-label="Настройки"
                  data-message="Настройки в этом превью не подключены.">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m10 3-.6 2.4-2 .9-2.2-1-2 3.4 1.9 1.6v2.4l-1.9 1.6 2 3.4 2.2-1 2 .9L10 20h4l.6-2.4 2-.9 2.2 1 2-3.4-1.9-1.6v-2.4l1.9-1.6-2-3.4-2.2 1-2-.9L14 3z"/>
              <circle cx="12" cy="11.5" r="2.8"/>
            </svg>
          </button>
        </div>

        <p class="tagline">Двигайся к своим целям!</p>
      </header>

  <fieldset class="training-types">
  <legend>Тип тренировки</legend>

  <div class="training-types__list">
    <label class="training-option">
      <input type="radio" name="training-type" value="Болдер" checked>
      <span class="training-option__row">
        <span class="training-option__badge" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path d="m31 5 11 3 2 11-4 9 1 13-10 3 2-10-4-9 4-8z"
                  fill="currentColor" stroke="none"/>
            <circle cx="14" cy="13" r="4" fill="currentColor" stroke="none"/>
            <path d="m13 21 7-3 6-10m-13 13-1 9 9 6 4 8m-12-23 9 7 7-4 5 7"/>
          </svg>
        </span>
        <span>Болдер</span>
      </span>
    </label>

    <label class="training-option">
      <input type="radio" name="training-type" value="Трудность">
      <span class="training-option__row">
        <span class="training-option__badge" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <circle cx="21" cy="12" r="4" fill="currentColor" stroke="none"/>
            <path d="m17 21 9-1 9-11m-18 12-4 13-6 9m9-15 11 1-2 10"/>
            <path d="M37 5c-1 15-5 28-11 39" stroke-width="2"/>
          </svg>
        </span>
        <span>Трудность</span>
      </span>
    </label>

    <label class="training-option">
      <input type="radio" name="training-type" value="Скалы">
      <span class="training-option__row">
        <span class="training-option__badge" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path d="M2 41 14 22l3 4L26 6l10 17 3-4 8 22h-7l-5-10-3 3-6-15-5 14-4-4-8 12z"
                  fill="currentColor" stroke="none"/>
            <path d="m18 41 8-11 6 11z" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span>Скалы</span>
      </span>
    </label>

    <label class="training-option">
      <input type="radio" name="training-type" value="ОФП">
      <span class="training-option__row">
        <span class="training-option__badge" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path d="M6 6v11m6-12v13m24-13v13m6-12v11M12 11h24"/>
            <circle cx="24" cy="24" r="5" fill="currentColor" stroke="none"/>
            <path d="m12 17 5 11 7 5 7-5 5-11"/>
            <path d="m16 29 8 4 8-4-2 15H18z"
                  fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span>ОФП</span>
      </span>
    </label>
  </div>
</fieldset>

    </div>

    <div class="home-bottom">
      <div class="home-start-wrap">
        <button class="start" type="button"
                data-message="Запуск тренировки в этом превью пока не подключён.">
          Начать тренировку
        </button>
      </div>

      <img class="reference-ridge"
           src="./assets/reference-v3/home-ridge.png"
           width="412" height="86" alt="">

      <nav class="dock" aria-label="Основное меню">
        <button type="button" aria-current="page" id="home-tab">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m2 11 10-8 10 8h-3v10h-5v-6h-4v6H5V11z" fill="currentColor"/>
          </svg>
          Главная
        </button>

        <button type="button" data-message="Дневник доступен в основном превью.">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="16" rx="2"/>
            <path d="M7 3v4m10-4v4M3 10h18m-13 4h3m-3 3h6"/>
          </svg>
          Дневник
        </button>

        <button type="button"
                data-message="Статистика в этом превью не подключена.">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 20v-5m5 5v-8m5 8V8m5 12V4" stroke-width="3"/>
          </svg>
          Статистика
        </button>

        <button type="button" data-message="Профиль в этом превью не подключён.">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="7" r="4"/>
            <path d="M4 21v-2a8 5 0 0 1 16 0v2z"/>
          </svg>
          Профиль
        </button>
      </nav>
    </div>
  </main>

  <p class="toast" id="toast" role="status" hidden></p>

  <script>
    const toast = document.getElementById('toast');
    let toastTimer;
const startButton = document.querySelector('.start');

startButton.addEventListener('click', () => {
  const selected = document.querySelector('input[name="training-type"]:checked');
  startButton.dataset.message =
    `Выбрано: ${selected.value}. Экран тренировки пока не подключён.`;
});
    
    document.querySelectorAll('[data-message]').forEach((button) => {
      button.addEventListener('click', () => {
        clearTimeout(toastTimer);
        toast.textContent = button.dataset.message;
        toast.hidden = false;

        toastTimer = setTimeout(() => {
          toast.hidden = true;
        }, 2500);
      });
    });

    document.getElementById('home-tab').addEventListener('click', () => {
      window.scrollTo(0, 0);
    });
  </script>
</body>
</html>
